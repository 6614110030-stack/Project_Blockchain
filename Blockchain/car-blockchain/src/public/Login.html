<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ - CarChain</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scan-lines"></div>
<div class="grid-overlay"></div>

<div class="login-container">
  
  <div class="login-card">
    <div class="login-header">
      <div class="logo-section">
        <span class="logo-icon-large">⬡</span>
        <h1 class="login-title">CAR<span class="highlight">CHAIN</span></h1>
      </div>
      <p class="login-subtitle">Blockchain-based Maintenance System</p>
    </div>

    <div class="login-form">
      <div class="input-group-custom">
        <label for="username" class="input-label">
          <span class="label-icon">👤</span>
          ชื่อผู้ใช้
        </label>
        <input 
          id="username" 
          type="text"
          class="input-field" 
          placeholder="กรอกชื่อผู้ใช้"
          autocomplete="username"
        >
        <div class="input-border"></div>
      </div>

      <div class="input-group-custom">
        <label for="password" class="input-label">
          <span class="label-icon">🔒</span>
          รหัสผ่าน
        </label>
        <input 
          id="password" 
          type="password"
          class="input-field" 
          placeholder="กรอกรหัสผ่าน"
          autocomplete="current-password"
        >
        <div class="input-border"></div>
      </div>

      <button onclick="login()" class="submit-btn">
        <span class="btn-glow"></span>
        <span class="btn-icon">🔓</span>
        <span class="btn-text">เข้าสู่ระบบ</span>
      </button>
    </div>

    <div class="demo-accounts">
      <p class="demo-title">บัญชีทดสอบ:</p>
      <div class="demo-grid">
        <div class="demo-item">
          <strong>อู่ซ่อมรถ ABC:</strong>
          <code>garage1 / password123</code>
        </div>
        <div class="demo-item">
          <strong>อู่ซ่อมรถ XYZ:</strong>
          <code>garage2 / password123</code>
        </div>
        <div class="demo-item">
          <strong>ลูกค้า:</strong>
          <code>customer1 / password123</code>
        </div>
      </div>
      
      <div class="register-link">
        <p>ยังไม่มีบัญชี? <a href="register.html">ลงทะเบียนที่นี่</a></p>
      </div>
    </div>
  </div>

</div>

<script>
const API = "http://localhost:3000";

// Check if already logged in
if (localStorage.getItem('sessionId')) {
  window.location.href = 'dashboard.html';
}

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    Swal.fire({
      icon: 'error',
      title: 'กรุณากรอกข้อมูล',
      text: 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน',
      background: '#0a0a0a',
      color: '#ffffff'
    });
    return;
  }

  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Login failed');
    }

    // Store session
    localStorage.setItem('sessionId', data.sessionId);
    localStorage.setItem('user', JSON.stringify(data.user));

    Swal.fire({
      icon: 'success',
      title: 'เข้าสู่ระบบสำเร็จ',
      text: `ยินดีต้อนรับ ${data.user.shopName || data.user.username}`,
      background: '#0a0a0a',
      color: '#00ff88',
      timer: 1500,
      showConfirmButton: false
    }).then(() => {
      window.location.href = 'dashboard.html';
    });

  } catch (error) {
    Swal.fire({
      icon: 'error',
      title: 'เข้าสู่ระบบไม่สำเร็จ',
      text: error.message,
      background: '#0a0a0a',
      color: '#ff0044'
    });
  }
}

// Allow Enter key to login
document.getElementById('password').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') login();
});
</script>

<style>
.login-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.login-card {
  max-width: 500px;
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 3rem;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  animation: slideUp 0.8s ease-out;
}

.login-header {
  text-align: center;
  margin-bottom: 3rem;
}

.logo-section {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin-bottom: 1rem;
}

.logo-icon-large {
  font-size: 3rem;
  color: var(--primary);
  animation: rotate 4s linear infinite;
  filter: drop-shadow(0 0 20px var(--glow-primary));
}

.login-title {
  font-family: var(--font-display);
  font-size: 2.5rem;
  font-weight: 900;
  letter-spacing: 3px;
  margin: 0;
  color: var(--text-primary);
}

.login-subtitle {
  color: var(--text-muted);
  font-size: 0.9rem;
  margin: 0;
}

.login-form {
  margin-bottom: 2rem;
}

.demo-accounts {
  padding-top: 2rem;
  border-top: 1px solid var(--border);
}

.demo-title {
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 1rem;
  font-size: 0.9rem;
}

.demo-grid {
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}

.demo-item {
  padding: 0.8rem;
  background: rgba(0, 255, 136, 0.05);
  border: 1px solid rgba(0, 255, 136, 0.2);
  border-radius: 8px;
  font-size: 0.85rem;
}

.demo-item strong {
  color: var(--primary);
  display: block;
  margin-bottom: 0.3rem;
}

.demo-item code {
  color: var(--text-secondary);
  background: rgba(0, 0, 0, 0.3);
  padding: 0.2rem 0.5rem;
  border-radius: 4px;
}

.register-link {
  margin-top: 1.5rem;
  text-align: center;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
}

.register-link p {
  color: var(--text-secondary);
  font-size: 0.9rem;
  margin: 0;
}

.register-link a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s ease;
}

.register-link a:hover {
  color: var(--primary-dark);
  text-decoration: underline;
}
</style>

</body>
</html>
