<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockchain Explorer - CarChain</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scan-lines"></div>
<div class="grid-overlay"></div>

<nav class="navbar navbar-dark">
  <div class="container">
    <div class="navbar-brand-container">
      <a href="dashboard.html" style="text-decoration:none;color:inherit;">
        <span class="navbar-brand">
          <span class="logo-icon">⬡</span>
          <span class="logo-text">CAR<span class="highlight">CHAIN</span></span>
        </span>
      </a>
      <div class="blockchain-pulse"></div>
    </div>
    <div class="nav-links">
      <span class="user-welcome" style="display:none;">สวัสดี, <span class="user-info">User</span></span>
      <a href="dashboard.html" class="nav-btn"><span class="btn-bg"></span><span class="btn-text">Dashboard</span></a>
      <a href="add.html" class="nav-btn garage-only" style="display:none;"><span class="btn-bg"></span><span class="btn-text">เพิ่มข้อมูล</span></a>
      <a href="search.html" class="nav-btn"><span class="btn-bg"></span><span class="btn-text">ค้นหารถ</span></a>
      <a href="blockchain.html" class="nav-btn active"><span class="btn-bg"></span><span class="btn-text">Blockchain</span></a>
      <a href="#" onclick="logout();return false;" class="nav-btn logout-btn"><span class="btn-bg"></span><span class="btn-text">ออกจากระบบ</span></a>
    </div>
  </div>
</nav>

<div class="container page-container">

  <div class="page-header">
    <div class="page-icon">⛓️</div>
    <h2 class="page-title">Blockchain Explorer</h2>
    <p class="page-subtitle">ตรวจสอบความถูกต้องของ Distributed Ledger แบบ Realtime</p>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-left">
      <div class="watch-indicator watch-connecting" id="watchDot"></div>
      <span id="watchStatus">กำลังเชื่อมต่อ...</span>
    </div>
    <div class="status-right">
      <span style="color:var(--text-muted);">อัปเดตล่าสุด:</span>
      <span id="lastUpdate" style="color:var(--primary);font-family:var(--font-display);font-size:0.8rem;">—</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="blockchain-controls">
    <button onclick="mineBlock()" class="control-btn mine-btn garage-only" style="display:none;">
      <span class="btn-glow"></span><span class="btn-icon">⛏</span><span class="btn-text">Mine New Block</span>
    </button>
    <button onclick="refreshAll()" class="control-btn load-btn">
      <span class="btn-glow"></span><span class="btn-icon">🔄</span><span class="btn-text">Refresh</span>
    </button>
    <button onclick="validateFromFile()" class="control-btn validate-btn">
      <span class="btn-glow"></span><span class="btn-icon">🔍</span><span class="btn-text">Validate จากไฟล์</span>
    </button>
    <button onclick="copyChain()" class="control-btn">
      <span class="btn-glow"></span><span class="btn-icon">📋</span><span class="btn-text">Copy JSON</span>
    </button>
  </div>

  <!-- Validation Result Panel -->
  <div id="validatePanel" class="validate-panel" style="display:none;">
    <div class="validate-header">
      <div class="validate-title" id="validateTitle">—</div>
      <div class="validate-meta" id="validateMeta"></div>
    </div>
    <div class="blocks-grid" id="blocksGrid"></div>
  </div>

  <!-- Chain Viewer -->
  <div class="blockchain-viewer">
    <div class="viewer-header">
      <div class="viewer-title">
        <span class="title-icon">📊</span>
        Chain Data
        <span class="file-badge">📄 blockchain.json</span>
      </div>
      <div class="viewer-stats">
        <div class="stat-item">
          <span class="stat-label">Blocks:</span>
          <span class="stat-value" id="blockCount">—</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Chain:</span>
          <span class="stat-value" id="chainStatusBadge">—</span>
        </div>
      </div>
    </div>
    <div class="code-container">
      <pre id="result" class="code-content">// กำลังโหลดข้อมูลจาก blockchain.json...</pre>
    </div>
  </div>

</div>

<script src="app.js"></script>
<script>
let pollingInterval = null;
let lastFingerprint = null;

// ===== โหลด chain จาก server =====
async function refreshAll() {
  const auth = checkAuth();
  if (!auth) return;
  try {
    const res  = await fetch(`${API}/api/chain`, { headers: getHeaders() });
    const data = await res.json();

    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    document.getElementById('blockCount').textContent = data.chain?.length || 0;

    const badge = document.getElementById('chainStatusBadge');
    badge.textContent = data.valid ? '✓ Valid' : '✗ Invalid';
    badge.style.color = data.valid ? 'var(--primary)' : 'var(--accent)';

    updateTimestamp();
  } catch (e) {
    document.getElementById('result').textContent = '// ❌ ไม่สามารถเชื่อมต่อ server ได้';
  }
}

// ===== Validate อ่านจากไฟล์โดยตรง =====
async function validateFromFile() {
  const auth = checkAuth();
  if (!auth) return;

  const panel = document.getElementById('validatePanel');
  const title = document.getElementById('validateTitle');
  const meta  = document.getElementById('validateMeta');
  const grid  = document.getElementById('blocksGrid');

  panel.style.display = 'block';
  title.innerHTML = '<span style="color:var(--text-muted)">⏳ กำลังอ่านไฟล์และตรวจสอบ Hash...</span>';
  grid.innerHTML = '';

  try {
    const res  = await fetch(`${API}/api/validate-file`, { headers: getHeaders() });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    if (data.valid) {
      title.innerHTML = '<span class="result-valid">✅ Chain Valid — ข้อมูลในไฟล์ถูกต้องทั้งหมด</span>';
      panel.className = 'validate-panel panel-valid';
    } else {
      title.innerHTML = '<span class="result-invalid">❌ Chain Invalid — พบข้อมูลที่ถูกแก้ไข!</span>';
      panel.className = 'validate-panel panel-invalid';
    }

    const savedAt = data.savedAt ? new Date(data.savedAt).toLocaleString('th-TH') : '—';
    meta.textContent = `บันทึกล่าสุด: ${savedAt} | ตรวจสอบ ${data.chain.length} blocks`;

    // Render block cards
    data.chain.forEach(block => {
      const card = document.createElement('div');
      card.className = `block-card ${block.valid ? 'block-ok' : 'block-fail'}`;

      if (block.note === 'Genesis Block') {
        card.innerHTML = `
          <div class="block-card-header">
            <span class="block-index">Block #${block.blockIndex}</span>
            <span class="block-badge badge-genesis">Genesis</span>
          </div>
          <div class="block-card-body">
            <div class="check-row ok">✓ Genesis Block — ข้ามการตรวจสอบ Hash</div>
          </div>`;
      } else {
        card.innerHTML = `
          <div class="block-card-header">
            <span class="block-index">Block #${block.blockIndex}</span>
            <span class="block-badge ${block.valid ? 'badge-ok' : 'badge-fail'}">
              ${block.valid ? '✓ Valid' : '✗ Tampered'}
            </span>
          </div>
          <div class="block-card-body">
            <div class="check-row ${block.hashMatch ? 'ok' : 'fail'}">
              ${block.hashMatch ? '✓' : '✗'} Hash ตรงกัน
              ${!block.hashMatch ? `<div class="hash-diff">
                <div class="hash-line"><span class="hash-label">ในไฟล์:</span><code class="hash-val fail-hash">${block.storedHash?.substring(0,40)}...</code></div>
                <div class="hash-line"><span class="hash-label">คำนวณได้:</span><code class="hash-val ok-hash">${block.calculatedHash?.substring(0,40)}...</code></div>
              </div>` : ''}
            </div>
            <div class="check-row ${block.linkMatch ? 'ok' : 'fail'}">
              ${block.linkMatch ? '✓' : '✗'} Previous Hash เชื่อมต่อถูกต้อง
              ${!block.linkMatch ? `<div class="hash-diff">
                <div class="hash-line"><span class="hash-label">ในไฟล์:</span><code class="hash-val fail-hash">${block.previousHashStored?.substring(0,40)}...</code></div>
                <div class="hash-line"><span class="hash-label">ควรเป็น:</span><code class="hash-val ok-hash">${block.previousHashExpected?.substring(0,40)}...</code></div>
              </div>` : ''}
            </div>
          </div>`;
      }
      grid.appendChild(card);
    });

    updateTimestamp();

  } catch (e) {
    title.innerHTML = `<span class="result-invalid">❌ เกิดข้อผิดพลาด: ${e.message}</span>`;
    panel.className = 'validate-panel panel-invalid';
  }
}

// ===== Polling Watcher — ตรวจไฟล์ทุก 3 วินาที =====
function startPollingWatcher() {
  const dot    = document.getElementById('watchDot');
  const status = document.getElementById('watchStatus');

  dot.className = 'watch-indicator watch-active';
  status.textContent = '👁 Watch blockchain.json — polling ทุก 3 วินาที';

  pollingInterval = setInterval(async () => {
    const auth = checkAuth();
    if (!auth) return;

    try {
      const res  = await fetch(`${API}/api/validate-file`, { headers: getHeaders() });
      if (!res.ok) throw new Error('Server error');
      const data = await res.json();

      // fingerprint จาก hash ของทุก block
      const fp = (data.chain || []).map(b => b.storedHash).join('|');

      if (lastFingerprint !== null && lastFingerprint !== fp) {
        // ตรวจพบการเปลี่ยนแปลง!
        dot.className = 'watch-indicator watch-changed';
        status.textContent = '⚠️ ตรวจพบการเปลี่ยนแปลงในไฟล์! กำลัง validate...';

        await refreshAll();
        await validateFromFile();

        // แจ้งเตือน
        Swal.fire({
          toast: true, position: 'top-end',
          icon: data.valid ? 'success' : 'warning',
          title: data.valid ? '✅ ไฟล์เปลี่ยน — Chain ยังถูกต้อง' : '❌ ไฟล์เปลี่ยน — Chain ถูกแก้ไข!',
          showConfirmButton: false, timer: 4000,
          background: '#0a0a0a',
          color: data.valid ? '#00ff88' : '#ff0044'
        });

        setTimeout(() => {
          dot.className = 'watch-indicator watch-active';
          status.textContent = '👁 Watch blockchain.json — polling ทุก 3 วินาที';
        }, 5000);
      }

      lastFingerprint = fp;
      dot.className = 'watch-indicator watch-active';

    } catch (e) {
      dot.className = 'watch-indicator watch-error';
      status.textContent = '❌ ไม่สามารถเชื่อมต่อ server';
    }
  }, 3000);
}

function updateTimestamp() {
  document.getElementById('lastUpdate').textContent = new Date().toLocaleString('th-TH');
}

async function copyChain() {
  const text = document.getElementById('result').textContent;
  await navigator.clipboard.writeText(text);
  Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Copied!', showConfirmButton: false, timer: 1500, background: '#0a0a0a', color: '#00ff88' });
}

window.addEventListener('load', async () => {
  await refreshAll();
  await validateFromFile();
  startPollingWatcher();
});

window.addEventListener('beforeunload', () => {
  if (pollingInterval) clearInterval(pollingInterval);
});
</script>

<style>
.status-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.8rem 1.5rem; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: 10px;
  margin-bottom: 1.5rem; font-size: 0.85rem; animation: slideUp 0.5s ease-out;
}
.status-left  { display: flex; align-items: center; gap: 0.8rem; color: var(--text-secondary); }
.status-right { display: flex; align-items: center; gap: 0.5rem; }

.watch-indicator {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.watch-connecting { background: var(--text-muted); }
.watch-active  { background: var(--primary);  box-shadow: 0 0 8px var(--primary); animation: pulse 2s infinite; }
.watch-changed { background: #ffaa00; box-shadow: 0 0 14px #ffaa00; animation: pulse 0.4s infinite; }
.watch-error   { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

.blockchain-controls {
  display: flex; gap: 1rem; margin-bottom: 1.5rem;
  justify-content: center; flex-wrap: wrap;
}
.control-btn {
  position: relative; padding: 0.9rem 1.8rem;
  background: var(--bg-card); border: 2px solid var(--border);
  border-radius: 12px; color: var(--text-primary);
  font-family: var(--font-display); font-size: 0.85rem; font-weight: 700;
  cursor: pointer; overflow: hidden; transition: all 0.3s ease;
  display: flex; align-items: center; gap: 0.5rem; letter-spacing: 1px;
}
.control-btn:hover      { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 8px 25px var(--glow-primary); }
.mine-btn:hover         { border-color: #ffaa00; box-shadow: 0 8px 25px rgba(255,170,0,0.3); }
.validate-btn:hover     { border-color: var(--secondary); box-shadow: 0 8px 25px var(--glow-secondary); }

/* Validate Panel */
.validate-panel {
  background: var(--bg-card); border: 2px solid var(--border);
  border-radius: 16px; padding: 2rem; margin-bottom: 2rem;
  animation: slideUp 0.5s ease-out;
}
.panel-valid   { border-color: var(--primary); box-shadow: 0 0 30px rgba(0,255,136,0.08); }
.panel-invalid { border-color: var(--accent);  box-shadow: 0 0 30px rgba(255,0,68,0.1); }

.validate-header { margin-bottom: 1.5rem; }
.validate-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; margin-bottom: 0.4rem; }
.validate-meta  { color: var(--text-muted); font-size: 0.82rem; }
.result-valid   { color: var(--primary); }
.result-invalid { color: var(--accent); }

/* Block Cards */
.blocks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 1rem;
}
.block-card {
  border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden; transition: all 0.3s ease;
  background: var(--bg-dark);
}
.block-card:hover { transform: translateY(-3px); }
.block-ok   { border-color: rgba(0,255,136,0.35); }
.block-fail { border-color: rgba(255,0,68,0.5); box-shadow: 0 4px 20px rgba(255,0,68,0.12); }

.block-card-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.75rem 1.2rem; background: rgba(0,0,0,0.3);
  border-bottom: 1px solid var(--border);
}
.block-index { font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; color: var(--text-primary); }

.block-badge {
  font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.7rem;
  border-radius: 20px; font-family: var(--font-display); letter-spacing: 0.5px;
}
.badge-ok      { background: rgba(0,255,136,0.12); color: var(--primary); border: 1px solid rgba(0,255,136,0.4); }
.badge-fail    { background: rgba(255,0,68,0.12);  color: var(--accent);  border: 1px solid rgba(255,0,68,0.4); }
.badge-genesis { background: rgba(0,102,255,0.12); color: var(--secondary); border: 1px solid rgba(0,102,255,0.4); }

.block-card-body { padding: 0.9rem 1.2rem; display: flex; flex-direction: column; gap: 0.5rem; }
.check-row {
  font-size: 0.84rem; padding: 0.35rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.check-row:last-child { border-bottom: none; }
.check-row.ok   { color: var(--primary); }
.check-row.fail { color: var(--accent); }

.hash-diff {
  margin-top: 0.5rem; padding: 0.6rem 0.8rem;
  background: rgba(0,0,0,0.4); border-radius: 6px;
  border-left: 2px solid var(--accent);
}
.hash-line { display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.25rem; font-size: 0.76rem; }
.hash-line:last-child { margin-bottom: 0; }
.hash-label { color: var(--text-muted); white-space: nowrap; min-width: 80px; }
.hash-val   { font-family: 'Courier New', monospace; word-break: break-all; }
.ok-hash    { color: var(--primary); }
.fail-hash  { color: var(--accent); text-decoration: line-through; opacity: 0.8; }

/* Chain Viewer */
.blockchain-viewer {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden;
}
.viewer-header {
  padding: 1.2rem 2rem; background: var(--bg-dark);
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.viewer-title {
  font-family: var(--font-display); font-size: 1.1rem; font-weight: 700;
  color: var(--primary); display: flex; align-items: center; gap: 0.8rem;
}
.file-badge {
  font-size: 0.72rem; color: var(--text-muted);
  border: 1px solid var(--border); padding: 0.2rem 0.6rem;
  border-radius: 6px; font-family: var(--font-body); letter-spacing: 0;
}
.viewer-stats { display: flex; gap: 1.5rem; }
.stat-item    { display: flex; align-items: center; gap: 0.5rem; }
.stat-label   { color: var(--text-muted); font-size: 0.85rem; }
.stat-value   { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; }

.code-content {
  padding: 2rem; margin: 0; background: var(--bg-dark);
  color: var(--primary); font-family: 'Courier New', monospace;
  font-size: 0.82rem; line-height: 1.7; overflow-x: auto;
  max-height: 500px; overflow-y: auto;
}
.code-content::-webkit-scrollbar { width: 6px; height: 6px; }
.code-content::-webkit-scrollbar-track { background: var(--bg-card); }
.code-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.code-content::-webkit-scrollbar-thumb:hover { background: var(--primary); }

@media (max-width: 768px) {
  .blocks-grid { grid-template-columns: 1fr; }
  .blockchain-controls { flex-direction: column; }
  .viewer-header { flex-direction: column; gap: 1rem; align-items: flex-start; }
  .status-bar { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
}
</style>
</body>
</html>
